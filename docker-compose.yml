services:
  postgres:
    image: postgres:16-alpine
    container_name: lsr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lsr_club
    ports:
      - "5432:5432"
    volumes:
      - lsr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lsr-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lsr_club?schema=public
      JWT_SECRET: change_me_access_secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: change_me_refresh_secret
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      LOGIN_RATE_LIMIT_WINDOW_MS: 900000
      LOGIN_RATE_LIMIT_MAX: 10
    ports:
      - "5000:5000"

volumes:
  lsr_postgres_data:
